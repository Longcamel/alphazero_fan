[project]
authors = [{name = "Longcamel", email = "suyuzhoucontact@gmail.com"}]
dependencies = []
name = "alphazero_fan"
requires-python = ">= 3.11"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
